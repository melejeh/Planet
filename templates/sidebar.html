        <a

            href="{{ url_for('semester') }}"
        >
            <span>▤</span>
            Courses &amp; Grades
        </a>

        <a
    href="{{ url_for('study_plan') }}"
    class="{% if active_page == 'study_plan' %}active{% endif %}"
>
    <span>✦</span>
    Study Plan
</a>

        <a
    class="{% if active_page == 'calendar' %}active{% endif %}"
    href="{{ url_for('calendar') }}"
>
    <span>□</span>

</a>

        <a
    href="{{ url_for('todo') }}"

>

</a>
        <a

    <div class="sidebar-profile">
        <div class="profile-circle">
            {{ name[0] }}
        </div>

        <div class="profile-details">
            <span class="profile-name">{{ name }}</span>

            <a class="sign-out-link" href="{{ url_for('logout') }}">
                Sign out
            </a>
        </div>
    </div>
</aside>

<script>
    (function () {
        const savedTheme = localStorage.getItem("planetTheme");
        const savedCompact = localStorage.getItem("planetCompact");
        const theme = savedTheme || "{{ planet_theme|default('editorial') }}";
        const compact = savedCompact !== null
            ? savedCompact
            : "{{ 'true' if planet_compact|default(false) else 'false' }}";

        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.compact = compact;
    })();
</script>
