<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

    <title>Create Account | Planet</title>
</head>

<body>
    <main class="login-page">

        <section class="welcome-section">
            <div class="logo">
                <span class="logo-icon">P</span>
                <span>Planet</span>
            </div>

            <div class="welcome-text">
                <p class="eyebrow">YOUR SEMESTER, ORGANIZED</p>

                <h1>Create your planet.</h1>

                <p class="description">
                    Bring your courses, deadlines, grades and study time
                    together in one place.
                </p>
            </div>
        </section>

        <section class="form-section">
            <div class="login-card">
                <h2>Create an account</h2>

                <p>Enter your details to start building your planet.</p>
                {% if error %}
                <div class="form-error">
                 {{ error }}
                 </div>
                   {% endif %}
                   
                <form method="POST" action="/signup">
                    <div class="name-row">
                        <div>
                            <label for="first_name">First name</label>

                            <input
                                type="text"
                                id="first_name"
                                name="first_name"
                                placeholder="First name"
                                required
                            >
                        </div>

                        <div>
                            <label for="last_name">Last name</label>

                            <input
                                type="text"
                                id="last_name"
                                name="last_name"
                                placeholder="Last name"
                                required
                            >
                        </div>
                    </div>

                    <label for="signup_email">Email address</label>

                    <input
                        type="email"
                        id="signup_email"
                        name="email"
                        placeholder="you@example.com"
                        required
                    >

                    <label for="signup_password">Password</label>

                    <input
                        type="password"
                        id="signup_password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >

                    <label for="confirm_password">Confirm password</label>

                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Enter your password again"
                        required
                    >

                    <button type="submit">Create my planet</button>
                </form>

                <p class="account-text">
                    Already have an account?
                    <a href="/">Log in</a>
                </p>
            </div>
        </section>

    </main>
</body>
</html>
