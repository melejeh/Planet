<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Forgot Password | Planet</title>
</head>
<body>
    <main class="login-page">
        <section class="welcome-section">
            <div class="logo">
                <span class="logo-icon">P</span>
                <span>Planet</span>
            </div>
            <div class="welcome-text">
                <p class="eyebrow">PASSWORD RESET</p>
                <h1>Find your way back.</h1>
                <p class="description">
                    Enter your account email and Planet will send you a secure,
                    time-limited reset link.
                </p>
            </div>
        </section>

        <section class="form-section">
            <div class="login-card">
                <h2>Reset your password</h2>
                <p>We’ll email you a link that expires in 30 minutes.</p>

                {% if message %}
                    <div class="form-success" role="status">{{ message }}</div>
                {% endif %}

                <form method="POST">
                    <label for="reset_email">Email address</label>
                    <input
                        type="email"
                        id="reset_email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >
                    <button type="submit">Send reset link</button>
                </form>

                <p class="account-text">
                    Remembered your password?
                    <a href="{{ url_for('core.home') }}">Log in</a>
                </p>
            </div>
        </section>
    </main>
</body>
</html>
